<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E5C86">
<title>Sunny Funny Days 勤怠実績</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0E5C86; overflow: hidden; }
  #f { display: block; border: 0; width: 100%; height: 100vh; height: 100dvh; }
  #ng {
    display: none; padding: 28px 22px; color: #fff;
    font-family: "Hiragino Kaku Gothic ProN", system-ui, sans-serif; line-height: 1.7;
  }
  #ng a { color: #8FE3FF; }

  /* 読み込みに10秒以上かかることがある。まっ白だと壊れて見えるので何か出す */
  #wait {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: linear-gradient(160deg, #0E5C86, #12A8C6 55%, #E89A22);
    color: #fff; font-family: "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  }
  #wait b { font-size: 20px; letter-spacing: .06em; line-height: 1.45; text-align: center; }
  #wait span { font-size: 13px; opacity: .85; }
  #wait i {
    width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.35); border-top-color: #fff;
    animation: sp 1s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<iframe id="f" title="Sunny Funny Days 勤怠実績" allow="clipboard-read; clipboard-write"></iframe>

<div id="wait">
  <b>Sunny Funny Days<br>勤怠実績</b>
  <i></i>
  <span>読み込んでいます…</span>
</div>

<div id="ng">
  <p>アプリを開けませんでした。</p>
  <p><a id="direct" href="#">こちらから直接開く</a></p>
</div>

<script>
(function () {
  /* 実績管理アプリ（Google Apps Script）の公開URL。
     ドメインを挟んだ形にしてある。ふつうの /macros/s/… の形は、
     Googleアカウントを複数使っていると 404 になるため。 */
  var EXEC = "https://script.google.com/a/macros/sunnyfunnydays.com/s/" +
             "AKfycbx3yQDH2IrIxRekzSd66WiPfxxdN-JZevvaNejxvTsYYn4DpivMlI_C4Z8EvK1n-uG8/exec";

  /* このページ自身のURL。担当を切り替えるとき、ここへ戻ってきてもらう。
     GAS のURLへ直接戻ると、包みが外れて Google の帯が出てしまう。 */
  var home = location.origin + location.pathname;

  var m = location.search.match(/[?&]who=(ayako|aoyagi)/);
  var src = EXEC + "?home=" + encodeURIComponent(home) + (m ? "&who=" + m[1] : "");

  var f = document.getElementById("f");
  document.getElementById("direct").href = src;
  f.src = src;

  /* 暗証番号をこちら側であずかる。
     iPhone は枠の中（Googleのページ）の保存を消してしまうので、
     このページ自身の保存に置く。番号はこの端末から出ない。 */
  window.addEventListener("message", function (ev) {
    if (!/^https:\/\/(script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/.test(ev.origin)) return;
    var d = ev.data || {};
    if (d.sfd === "save" && typeof d.v === "string" && /^[0-9]{3,8}$/.test(d.v)) {
      try { localStorage.setItem("sfd_pin", d.v); } catch (e) {}
    } else if (d.sfd === "forget") {
      try { localStorage.removeItem("sfd_pin"); } catch (e) {}
    } else if (d.sfd === "ask") {
      var v = "";
      try { v = localStorage.getItem("sfd_pin") || ""; } catch (e) {}
      if (v && ev.source) { try { ev.source.postMessage({ sfd: "pin", v: v }, ev.origin); } catch (e) {} }
    }
  });

  var wait = document.getElementById("wait");

  f.addEventListener("load", function () {
    f.dataset.ok = "1";
    /* 枠の中がまだ描けていないことがあるので、少しだけ待ってから覆いを外す */
    setTimeout(function () { wait.style.display = "none"; }, 1200);
  });

  /* それでも出てこないときは、直接開く道を見せる */
  setTimeout(function () {
    if (f.dataset.ok) return;
    wait.style.display = "none";
    f.style.display = "none";
    document.getElementById("ng").style.display = "block";
  }, 25000);
})();
</script>

</body>
</html>
